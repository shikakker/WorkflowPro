name: One-shot production dependency audit report

on:
  push:
    branches:
      - portfolio-improvements-2026-08
    paths:
      - .github/workflows/one-shot-audit-report.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Production audit report
        run: |
          npm audit --omit=dev --json > /tmp/audit.json || true
          node - <<'NODE'
          const report = require('/tmp/audit.json');
          const rows = Object.entries(report.vulnerabilities || {})
            .filter(([, v]) => ['high', 'critical'].includes(v.severity))
            .map(([name, v]) => ({ name, severity: v.severity, range: v.range, direct: v.isDirect, fixAvailable: v.fixAvailable }));
          console.log('HIGH_CRITICAL=' + JSON.stringify(rows, null, 2));
          console.log('METADATA=' + JSON.stringify(report.metadata?.vulnerabilities || {}));
          NODE
